[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "laserlock"
version = "0.1.0"
description = "Laser Lock: tunable laser locked to the comb through SLICE-OPL #2 and the Brimrose AOM, with the Rigol MHO5104"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "packaging",
    "tomli; python_version < '3.11'",
    "PySide6>=6.5",
    "pyqtgraph>=0.13",
    "pyserial>=3.5",
    "pyvisa>=1.11",
    "scipy>=1.7",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
laser-lock = "laserlock.gui.app:main"
laser-lock-cli = "laserlock.cli:main"

[tool.setuptools.packages.find]
include = ["laserlock*"]

[tool.setuptools.package-data]
"laserlock" = ["addons/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "laserlock/addons"]
addopts = "--import-mode=importlib -p no:cacheprovider"
